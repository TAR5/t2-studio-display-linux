name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: |
          bash -n install.sh uninstall.sh check.sh
          sh -n bin/studio-display-hbr3
          shellcheck install.sh uninstall.sh check.sh bin/studio-display-hbr3
      - name: Check whitespace
        run: git diff-tree --root --check --no-commit-id HEAD
